<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APP TO-DO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Mis actividades Personales</h1>

    <form id="formulario">
        <input type="text" id="titulo" placeholder="Escribe una actividad" required>
        <input type="date" id="fecha" title="Fecha límite">
        <select id="categoria">
            <option value="">Sin categoría</option>
        </select>
        <button type="submit">Agregar una actividad</button>
    </form>

<p id="mensaje"></p>

<div class="orden">
  <label for="orden">Ordenar por:</label>

  <select id="orden">
    <option value="antiguas">Más antiguas primero</option>
    <option value="recientes">Más recientes primero</option>
    <option value="estado">Pendientes primero</option>
    <option value="alfabetico">Alfabético (A-Z)</option>
    <option value="fecha">Fecha límite (próximas primero)</option>
  </select>

  <label for="filtro">Categoría:</label>
  
  <select id="filtro">
    <option value="">Todas</option>
    <option value="sin">Sin categoría</option>
  </select>

</div>

    <ul id="lista"></ul>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

</body>
</html>
